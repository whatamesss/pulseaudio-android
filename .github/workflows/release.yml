name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Pin the runner image so a `ubuntu-latest` rollover cannot silently change
    # the JDK/Android toolchain between releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v6 targets Node 24. v4 still targets Node 20, which GitHub now forces
      # onto Node 24 and reports as deprecated on every run.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version_name}"
            exit 1
          fi

      - name: Check release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}"
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > keystore/release.jks
          test -s keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::assembleRelease attempt ${attempt} of 3"
            if ./gradlew --no-daemon --stacktrace assembleRelease; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::assembleRelease failed on attempt ${attempt} of 3"
            sleep 10
          done
          echo "::error::assembleRelease failed after 3 attempts"
          exit 1

      - name: Run quality checks
        # Best effort: a flaky socket/timing test or a transient dependency
        # download must not block a release whose APK already built. Failures
        # are retried, reported as warnings, and uploaded as artifacts so they
        # can still be investigated without failing the run.
        continue-on-error: true
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::qualityCheck attempt ${attempt} of 3"
            if ./gradlew --no-daemon --stacktrace qualityCheck; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::qualityCheck failed on attempt ${attempt} of 3"
            sleep 10
          done
          echo "::warning::qualityCheck failed after 3 attempts; publishing anyway"
          exit 1

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*
            app/build/reports/detekt/**
            app/build/reports/kover/**

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/release/pulseserver-*-release.apk
