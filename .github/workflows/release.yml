name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches app version
        run: |
          version_name=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version_name}" >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build and check
        run: ./gradlew qualityCheck assembleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/pulseserver-*-release.apk
          generate_release_notes: true
